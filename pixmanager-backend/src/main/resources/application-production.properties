# Production Configuration - PixManager
spring.application.name=PixManager

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pixelsoftwaredesign}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pixelsoft}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me_in_production}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (disabled in production)
spring.h2.console.enabled=false

# Server
server.port=8080

# CORS (will be handled by nginx in production)
spring.web.cors.allowed-origins=http://localhost:4200,http://localhost:4201,https://crm.pixelsoftwaredesign.xyz,https://erp.pixelsoftwaredesign.xyz

# JWT (shared with PixERP for cross-app auth)
jwt.secret=${JWT_SECRET:pixelsoftwaredesign-shared-secret-key-2026-unified-auth}
jwt.expiration=86400000

# Internal API Key (shared with PixERP for cross-app data sync)
internal.api.key=${INTERNAL_API_KEY:pixelsoft-internal-api-key-2026}
internal.api.peer-url=${INTERNAL_API_PEER_URL:http://localhost:8081}
