spring.application.name=PixManager

# H2 Database (Development)
spring.datasource.url=jdbc:h2:mem:pixmanager;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080

# CORS
spring.web.cors.allowed-origins=http://localhost:4200

# JWT
jwt.secret=pixelsoftwaredesign-pixmanager-secret-key-2026-very-long-and-secure-string
jwt.expiration=86400000
