spring.application.name=PixERP

# H2 Database
spring.datasource.url=jdbc:h2:mem:pixerp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8081

# CORS
spring.web.cors.allowed-origins=http://localhost:4201

# JWT (shared with PixManager for cross-app auth)
jwt.secret=pixelsoftwaredesign-shared-secret-key-2026-unified-auth
jwt.expiration=86400000
