services:
  # PostgreSQL Database
  - type: postgresql
    name: pixelsoftwaredesign-db
    plan: free
    databaseName: pixelsoftwaredesign
    ipAllowList: []

  # PixManager Backend (CRM)
  - type: web
    name: pixmanager-backend
    runtime: docker
    dockerfilePath: ./pixmanager-backend/Dockerfile
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: pixelsoftwaredesign-db
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_API_KEY
        value: pixelsoft-internal-api-key-2026
      - key: INTERNAL_API_PEER_URL
        value: https://pixerp-backend.onrender.com
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms256m"

  # PixERP Backend
  - type: web
    name: pixerp-backend
    runtime: docker
    dockerfilePath: ./pixerp-backend/Dockerfile
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: pixelsoftwaredesign-db
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_API_KEY
        value: pixelsoft-internal-api-key-2026
      - key: INTERNAL_API_PEER_URL
        value: https://pixmanager-backend.onrender.com
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms256m"

  # PixManager Frontend (CRM)
  - type: static_site
    name: crm-frontend
    buildCommand: cd pixmanager-frontend && npm install && npx ng build --configuration=production
    staticPublishPath: ./pixmanager-frontend/dist/pixmanager-app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # PixERP Frontend
  - type: static_site
    name: erp-frontend
    buildCommand: cd pixerp-frontend && npm install && npx ng build --configuration=production
    staticPublishPath: ./pixerp-frontend/dist/pixerp-app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
